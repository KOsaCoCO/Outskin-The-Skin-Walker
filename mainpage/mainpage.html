<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu</title>
    <link rel="stylesheet" href="mainpage.css">
</head>
<body>
    <main class="container">
        <h1 id="greeting">Hello</h1>

        <!-- GAME REMODEL: the old card game (Start Game) button is
             removed for good — not archived, just gone from this menu.
             Its files/route are untouched elsewhere (see mainpage.js)
             in case they're ever wanted again, but this page no longer
             links to it. Game Rules / Card Info / Settings stay
             archived for now the same way; add their <button> lines
             back whenever they're needed too. -->
        <nav class="menu">
            <button class="menu-btn" data-action="talking">Game Start</button>
            <!-- Clears every saved body-design drawing from a
                 previous "Game Start" round (the localStorage keys
                 Body Data.js in Skin-Walker Game/ saves under — see
                 mainpage.js's STORAGE_PREFIX comment for why the
                 prefix has to be kept in sync by hand). Handled
                 separately from the menu-btn buttons above since it
                 doesn't navigate anywhere. -->
            <button id="reset-game-btn" class="menu-btn menu-btn-reset">Reset Game</button>
        </nav>
    </main>

    <script src="mainpage.js"></script>
    <!-- Music/mute button is archived for now — we'll wire the sound
         system back in later. Game Audio.js itself is untouched in
         Audio/, this is just not loading it on this page right now. -->
</body>
</html>
